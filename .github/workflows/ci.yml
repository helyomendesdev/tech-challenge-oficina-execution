name: CI

on:
  push:
    branches: [main, develop, "feature/*", "fix/*", "feat/*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-quality:
    name: Tests, coverage, lint and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit and adapter integration tests
        run: python -m pytest -v --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-service-coverage
          path: coverage.xml
          if-no-files-found: warn

      - name: Build container image
        run: docker build -t execution-service:${{ github.sha }} .

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize without remote backend
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=infra validate -no-color
